<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AskAI - Signup</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-body">


<div class="auth-container">


    <div class="auth-card">


        <div class="auth-logo">
            🤖
        </div>


        <h1>
            Create Account
        </h1>


        <p>
            Join AskAI and start using your AI assistant.
        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST"
              class="auth-form">


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required>


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required>


            <button type="submit">
                🚀 Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

</body>

</html>
